[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[package]
name = "avalanche"
version = "0.1.0"
edition = "2024"
default-run = "avalanche"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
asynclog = { version = "1.1.3", features = ["tokio"] }
dashmap = "7.0.0-rc2"
papaya = "0.2.5"
anyhow = "1.0.104"
log = "0.4.35"
bytes = "1.12.1"
